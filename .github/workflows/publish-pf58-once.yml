name: Publish accepted pf58 once
on:
  push:
    branches: [personal/parakeet-futo]
    paths: [.github/workflows/publish-pf58-once.yml]
concurrency:
  group: accepted-pf58-mirror
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify and publish exact accepted files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,tempfile,urllib.request
          REPO='gagebt/HeliBoard'
          TAG='4.1-pf58'
          BODY="# Keyboard 4.1-pf58 (code 4167): compact clipboard and symbol hints\n\nPersonal, non-commercial beta. Component terms are unchanged; see the notice.\n\n## What changed\n- **Clipboard keys:** the All/filter and history-search keys are compact icons in the lower key row. The old row above the list is gone. One tap on filter still cycles All, Dictated and Copied.\n- **Text:** copied text is smaller than before, larger than dictated text.\n- **Previews:** no scrolling inside cards; long ones end with an ellipsis. The list scrolls. Details show the full text.\n- **Details:** icon actions for what applies to the item. Copy all applies only to items with text.\n- **?123 symbol pages:** small alternate hints use the normal small-hint color.\n- **Search field:** text and hint colors follow the theme.\n- **Keyboard size:** Unchanged in the captured Full and Lite states against their previous normal keyboard frames. Full1080x898 and Lite1080x772 include the suggestion strip; this is not a physical-phone measurement.\n\n## Good to know\n- In details, select text and use the system Copy popup for part of an item; Copy all copies the whole item. The upper toolbar Copy still targets the editor or the query.\n- After results appear, searching again or clearing takes one extra step: tap the search key, then use the query field's clear or back control. Space keeps its normal meaning.\n\nThe attached source archive is the corresponding source for these APKs. The repository branch and GitHub-generated tag source archive still contain earlier app source. Use the attached source archive for this release.\n\n## Files\n- **Full** (voice input): 560172602 bytes, SHA-256 `ceaa8334b0620756e9e2270ad02547dd2ec141b32b04ba182c83c9382dce103f`. https://olegk.ai/dl-zfqlope5olthyny/heliboard-parakeet-futo-4.1-pf58.apk\n- **Lite** (separate app ID; no large voice library or model; voice off): 92241194 bytes, SHA-256 `16dfe5648779d4d6b5c28439879c051f01275875e4a9adfd30d1368130610aec`. https://olegk.ai/dl-zfqlope5olthyny/heliboard-parakeet-futo-4.1-pf58-lite.apk\n- **Source:** https://olegk.ai/dl-zfqlope5olthyny/heliboard-parakeet-futo-4.1-pf58-source.tar.gz (620092246 bytes, SHA-256 `d396dfbce9f1e31f774cdf301739f170680bf263140044b4498bc75fb76b6abf`)\n- **Notice:** https://olegk.ai/dl-zfqlope5olthyny/heliboard-parakeet-futo-4.1-pf58-NOTICE.txt (31725 bytes, SHA-256 `ee6926e5c27246e4efbd742eeb901329f012bee01fb5ee60670aaba900a81504`)\n\nBoth: 4.1-pf58, code 4167, certificate SHA-256 `51ca207212fc200ea8e9f004a441ca3b9a27e519a53526dc51a3edf369166d3b`. Install as an update; uninstalling can remove saved data.\n\n## Checked\n- 152 affected host tests pass (76 per variant). This is not a whole-project run.\n- Runtime: Three exact Android insertion/next-letter cases pass: Full copied text, Full selected-word replacement with a nine-line dictated item, and Lite Cyrillic nine-line insertion. Clear/cancel and subsequent typing preserve the notes. Both seeded guests are restored to their original selected state, with8protected note hashes each unchanged and grants revoked. Users: Both fresh public users and one fresh owner reach their goals. The two public runs remain FAIL (clean0/2); the owner also reports FAIL. All37 anomaly entries are retained and dispositioned. Copy works in direct software Paste and in hardware Paste after return to the editor; a hardware Paste key does nothing while read-only details has focus. Optional clarity/row-edge/deletion-recovery findings and an unresolved coarse Undo/caret observation remain open. Narrow Sol and Opus code/design checks pass; this is no whole-keyboard or bug-free claim.\n- A 100,000-character item stays whole in host tests (one item, not 100,000 history items).\n- Native code is compared with accepted 56 files; no fresh native build or reproducibility claim.\n\n## Not checked or open\n- Physical phone, ARM64, current voice, original browser, all-language quality.\n- An earlier unexplained keyboard hide and long-text editor hang are not fixed; the cause is not established.\n- The optional Space cue and other convenience items are deferred.\n"
          BASE='https://olegk.ai/dl-zfqlope5olthyny/'
          OBJECTS=[{"kind":"source","name":"heliboard-parakeet-futo-4.1-pf58-source.tar.gz","bytes":620092246,"sha256":"d396dfbce9f1e31f774cdf301739f170680bf263140044b4498bc75fb76b6abf"},{"kind":"notice","name":"heliboard-parakeet-futo-4.1-pf58-NOTICE.txt","bytes":31725,"sha256":"ee6926e5c27246e4efbd742eeb901329f012bee01fb5ee60670aaba900a81504"},{"kind":"full","name":"heliboard-parakeet-futo-4.1-pf58.apk","bytes":560172602,"sha256":"ceaa8334b0620756e9e2270ad02547dd2ec141b32b04ba182c83c9382dce103f"},{"kind":"lite","name":"heliboard-parakeet-futo-4.1-pf58-lite.apk","bytes":92241194,"sha256":"16dfe5648779d4d6b5c28439879c051f01275875e4a9adfd30d1368130610aec"}]
          def gh(args):
           r=subprocess.run(['gh']+args,capture_output=True,text=True)
           if r.returncode:raise RuntimeError('GitHub command failed: '+r.stderr.strip())
           return json.loads(r.stdout)
          def sha_stream(f):
           h=hashlib.sha256();size=0
           while b:=f.read(4*1024*1024):h.update(b);size+=len(b)
           return size,h.hexdigest()
          def exact(obj,size,digest):return size==obj['bytes'] and digest==obj['sha256']
          def check_controls():
           obj=OBJECTS[0]
           assert exact(obj,obj['bytes'],obj['sha256'])
           assert not exact(obj,obj['bytes']-1,obj['sha256'])
           assert not exact(obj,obj['bytes'],'0'*64)
          def absent(endpoint):
           r=subprocess.run(['gh','api',endpoint],capture_output=True,text=True)
           if r.returncode==0:raise RuntimeError('Existing GitHub object: reconcile before another publication')
           if 'HTTP 404' not in r.stderr:raise RuntimeError('Cannot establish pre-egress absence')
          def no_release(pages):
           if not isinstance(pages,list):raise RuntimeError('Cannot establish release absence')
           for page in pages:
            if not isinstance(page,list):raise RuntimeError('Cannot establish release absence')
            for release in page:
             if not isinstance(release,dict) or not isinstance(release.get('tag_name'),str):raise RuntimeError('Unreadable release identity')
             if release['tag_name']==TAG:raise RuntimeError('Existing release or draft: reconcile before another publication')
          def release_absent():
           no_release(gh(['api','--paginate','--slurp','repos/'+REPO+'/releases?per_page=100']))
          def verify_public(obj,url):
           req=urllib.request.Request(url,headers={'User-Agent':'HeliBoard58-release-proof','Accept-Encoding':'identity'})
           with urllib.request.urlopen(req,timeout=120) as f:
            assert f.status==200
            size,digest=sha_stream(f)
           assert exact(obj,size,digest),'Public download differs'
           return {'name':obj['name'],'url':url,'bytes':size,'sha256':digest,'status':200}
          def main():
           assert BODY!='PARENT_FINAL_RELEASE_TEXT_PENDING' and all(x['bytes']>0 and len(x['sha256'])==64 for x in OBJECTS),'Final accepted objects and text are required'
           check_controls()
           assert os.environ.get('GITHUB_REPOSITORY')==REPO
           assert os.environ.get('GITHUB_REF')=='refs/heads/personal/parakeet-futo'
           repo=gh(['api','repos/'+REPO]);assert repo['private'] is False and repo['archived'] is False
           release_absent();absent('repos/'+REPO+'/git/ref/tags/'+TAG)
           with tempfile.TemporaryDirectory(prefix='heliboard58-') as tmp:
            work=pathlib.Path(tmp)
            free=os.statvfs(work).f_bavail*os.statvfs(work).f_frsize
            assert free>sum(o['bytes'] for o in OBJECTS)*2+1_000_000_000
            paths=[]
            for obj in OBJECTS:
             p=work/obj['name'];h=hashlib.sha256();size=0
             req=urllib.request.Request(BASE+obj['name'],headers={'Accept-Encoding':'identity','User-Agent':'HeliBoard58-copy'})
             with urllib.request.urlopen(req,timeout=120) as source,p.open('xb') as target:
              assert source.status==200
              while b:=source.read(4*1024*1024):target.write(b);h.update(b);size+=len(b)
              target.flush();os.fsync(target.fileno())
             assert exact(obj,size,h.hexdigest()),'Website input differs; no release egress'
             paths.append(str(p));print(json.dumps({'stage':'input-verified','name':obj['name'],'bytes':size,'sha256':h.hexdigest()}),flush=True)
            payload={'tag_name':TAG,'target_commitish':os.environ['GITHUB_SHA'],'name':'HeliBoard Full/Lite 4.1-pf58 — personal noncommercial beta','body':BODY,'draft':True,'prerelease':True}
            request=work/'release.json';request.write_text(json.dumps(payload))
            release_absent()
            print(json.dumps({'stage':'create-intent','tag':TAG,'retry':'Do not repeat an uncertain creation'}),flush=True)
            release=gh(['api','--method','POST','repos/'+REPO+'/releases','--input',str(request)])
            release_id=release['id'];assert release['draft'] is True
            print(json.dumps({'stage':'draft-created','releaseId':release_id,'tag':TAG}),flush=True)
            r=subprocess.run(['gh','release','upload',TAG,'--repo',REPO]+paths,capture_output=True,text=True)
            if r.returncode:raise RuntimeError('Upload incomplete; preserve draft '+str(release_id)+' and reconcile: '+r.stderr.strip())
            current=gh(['api','repos/'+REPO+'/releases/'+str(release_id)])
            assert current['draft'] is True and current['tag_name']==TAG
            assets={a['name']:a for a in current['assets']};assert set(assets)=={o['name'] for o in OBJECTS}
            for obj in OBJECTS:
             asset=assets[obj['name']];assert asset['size']==obj['bytes'] and asset['state']=='uploaded'
             digest=asset.get('digest')
             if digest:
              assert digest=='sha256:'+obj['sha256'],'GitHub-computed digest differs'
             else:
              p=subprocess.Popen(['gh','api','repos/'+REPO+'/releases/assets/'+str(asset['id']),'-H','Accept: application/octet-stream'],stdout=subprocess.PIPE,stderr=subprocess.PIPE)
              size,hashed=sha_stream(p.stdout);error=p.stderr.read();assert p.wait()==0 and exact(obj,size,hashed),'Draft asset readback failed'
            print(json.dumps({'stage':'four-draft-assets-verified','releaseId':release_id}),flush=True)
            publish=work/'publish.json';publish.write_text(json.dumps({'draft':False}))
            print(json.dumps({'stage':'publish-intent','releaseId':release_id}),flush=True)
            visible=gh(['api','--method','PATCH','repos/'+REPO+'/releases/'+str(release_id),'--input',str(publish)])
            assert visible['draft'] is False
            proof=[]
            for obj in OBJECTS:
             url='https://github.com/'+REPO+'/releases/download/'+TAG+'/'+obj['name'];item=verify_public(obj,url);proof.append(item)
             print(json.dumps({'stage':'public-full-hash-verified',**item}),flush=True)
            print(json.dumps({'stage':'complete','releaseId':release_id,'url':visible['html_url'],'assets':proof,'rebuilt':False,'resigned':False}),flush=True)
          if __name__=='__main__':main()
          
          PY
