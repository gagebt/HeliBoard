name: Publish accepted pf56 once
on:
  push:
    branches: [personal/parakeet-futo]
    paths: [.github/workflows/publish-pf56-once.yml]
concurrency:
  group: accepted-pf56-mirror
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify and publish exact accepted files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,tempfile,urllib.request
          REPO='gagebt/HeliBoard'
          TAG='4.1-pf56'
          BASE='https://olegk.ai/dl-zfqlope5olthyny/'
          OBJECTS=[{"kind":"source","name":"heliboard-parakeet-futo-4.1-pf56-source.tar.gz","bytes":702809958,"sha256":"3b3f5433830bf8c933acd2a51ad554831cffa945b553a8691bc987c15824870e"},{"kind":"notice","name":"heliboard-parakeet-futo-4.1-pf56-NOTICE.txt","bytes":30422,"sha256":"2b8e8c8cf5044460dcdb9e0d322d599cca5fb8e80aa4320a34738e4df3c76ce3"},{"kind":"full","name":"heliboard-parakeet-futo-4.1-pf56.apk","bytes":642655247,"sha256":"4d3b41bcbe9c71d78137f5f16bd81a6f98694d42022d63881bd8d9b51f413d4b"},{"kind":"lite","name":"heliboard-parakeet-futo-4.1-pf56-lite.apk","bytes":174723839,"sha256":"677bb291ba1bd08c2d0457054a1d5a463eedda2fa5de87bccef84cf127aaff1b"}]
          def gh(args):
           r=subprocess.run(['gh']+args,capture_output=True,text=True)
           if r.returncode:raise RuntimeError('GitHub command failed: '+r.stderr.strip())
           return json.loads(r.stdout)
          def sha_stream(f):
           h=hashlib.sha256();size=0
           while b:=f.read(4*1024*1024):h.update(b);size+=len(b)
           return size,h.hexdigest()
          def exact(obj,size,digest):return size==obj['bytes'] and digest==obj['sha256']
          def check_controls():
           obj=OBJECTS[0]
           assert exact(obj,obj['bytes'],obj['sha256'])
           assert not exact(obj,obj['bytes']-1,obj['sha256'])
           assert not exact(obj,obj['bytes'],'0'*64)
          def absent(endpoint):
           r=subprocess.run(['gh','api',endpoint],capture_output=True,text=True)
           if r.returncode==0:raise RuntimeError('Existing GitHub object: reconcile before another publication')
           if 'HTTP 404' not in r.stderr:raise RuntimeError('Cannot establish pre-egress absence')
          def no_release(pages):
           if not isinstance(pages,list):raise RuntimeError('Cannot establish release absence')
           for page in pages:
            if not isinstance(page,list):raise RuntimeError('Cannot establish release absence')
            for release in page:
             if not isinstance(release,dict) or not isinstance(release.get('tag_name'),str):raise RuntimeError('Unreadable release identity')
             if release['tag_name']==TAG:raise RuntimeError('Existing release or draft: reconcile before another publication')
          def release_absent():
           no_release(gh(['api','--paginate','--slurp','repos/'+REPO+'/releases?per_page=100']))
          def verify_public(obj,url):
           req=urllib.request.Request(url,headers={'User-Agent':'HeliBoard56-release-proof','Accept-Encoding':'identity'})
           with urllib.request.urlopen(req,timeout=120) as f:
            assert f.status==200
            size,digest=sha_stream(f)
           assert exact(obj,size,digest),'Public download differs'
           return {'name':obj['name'],'url':url,'bytes':size,'sha256':digest,'status':200}
          def main():
           check_controls()
           assert os.environ.get('GITHUB_REPOSITORY')==REPO
           assert os.environ.get('GITHUB_REF')=='refs/heads/personal/parakeet-futo'
           repo=gh(['api','repos/'+REPO]);assert repo['private'] is False and repo['archived'] is False
           release_absent();absent('repos/'+REPO+'/git/ref/tags/'+TAG)
           with tempfile.TemporaryDirectory(prefix='heliboard56-') as tmp:
            work=pathlib.Path(tmp)
            free=os.statvfs(work).f_bavail*os.statvfs(work).f_frsize
            assert free>sum(o['bytes'] for o in OBJECTS)*2+1_000_000_000
            paths=[]
            for obj in OBJECTS:
             p=work/obj['name'];h=hashlib.sha256();size=0
             req=urllib.request.Request(BASE+obj['name'],headers={'Accept-Encoding':'identity','User-Agent':'HeliBoard56-copy'})
             with urllib.request.urlopen(req,timeout=120) as source,p.open('xb') as target:
              assert source.status==200
              while b:=source.read(4*1024*1024):target.write(b);h.update(b);size+=len(b)
              target.flush();os.fsync(target.fileno())
             assert exact(obj,size,h.hexdigest()),'Website input differs; no release egress'
             paths.append(str(p));print(json.dumps({'stage':'input-verified','name':obj['name'],'bytes':size,'sha256':h.hexdigest()}),flush=True)
            payload={'tag_name':TAG,'target_commitish':os.environ['GITHUB_SHA'],'name':'HeliBoard Full/Lite 4.1-pf56 — personal noncommercial beta','body':"# HeliBoard Parakeet/FUTO 4.1-pf56 (code 4165), personal beta\n\nThis is a personal, noncommercial beta of a HeliBoard fork. It is not an official HeliBoard release.\n\n## Downloads\n\nPick one APK. The Full APK adds offline voice input. The Lite APK does not have the large offline voice component.\n\n| File | Size | SHA-256 |\n|---|---|---|\n| Full: https://github.com/gagebt/HeliBoard/releases/download/4.1-pf56/heliboard-parakeet-futo-4.1-pf56.apk | 642,655,247 bytes (about 613 MiB) | 4d3b41bcbe9c71d78137f5f16bd81a6f98694d42022d63881bd8d9b51f413d4b |\n| Lite: https://github.com/gagebt/HeliBoard/releases/download/4.1-pf56/heliboard-parakeet-futo-4.1-pf56-lite.apk | 174,723,839 bytes (about 167 MiB) | 677bb291ba1bd08c2d0457054a1d5a463eedda2fa5de87bccef84cf127aaff1b |\n\nThe same files are mirrored on the website.\n\n**Source tree.** The code tree on the branch is the 30 September snapshot. The tag marks the publication commit. Only the release asset `heliboard-parakeet-futo-4.1-pf56-source.tar.gz` matches the APKs.\n\n## Source and NOTICE\n\n- Complete corresponding source for these builds: https://github.com/gagebt/HeliBoard/releases/download/4.1-pf56/heliboard-parakeet-futo-4.1-pf56-source.tar.gz (702,809,958 bytes, SHA-256 3b3f5433830bf8c933acd2a51ad554831cffa945b553a8691bc987c15824870e). Use the asset named `heliboard-parakeet-futo-4.1-pf56-source.tar.gz`.\n- Do not use the automatic GitHub \"Source code (zip)\" or \"Source code (tar.gz)\" links for this tag. They are not the complete corresponding build source.\n- NOTICE (licences, attribution, data terms): https://github.com/gagebt/HeliBoard/releases/download/4.1-pf56/heliboard-parakeet-futo-4.1-pf56-NOTICE.txt (30,422 bytes, SHA-256 2b8e8c8cf5044460dcdb9e0d322d599cca5fb8e80aa4320a34738e4df3c76ce3).\n\n## Install and update\n\n- Full keeps the existing application ID. It updates over published version 34 because the signer is the same.\n- Lite uses a different application ID. It is a separate app, not an update of Full.\n- Keep another keyboard enabled when you first install, so you can type if this keyboard fails.\n- Do not downgrade from this version to version 34. Android does not allow a normal downgrade. A downgrade needs an uninstall, and that deletes app data. Wait for a next fix instead.\n\nIf Android says \"App not installed\", download the APK again and check the SHA-256.\n\n## What changed at the end\n\nTwo last corrections: a closing quote at the end of long text, and the spacing after a group of punctuation marks.\n\n## Testing and known limits\n\n- Tested on x86_64 Android emulators only. No physical phone and no ARM64 device was tested.\n- Targeted tests: 326 of 326 passed. The whole suite: 1,324 of 1,328 passed. The 4 failures also appear in the old version. 10 test executions were omitted.\n- 4 focused user goals were met. The clean user-run check is still red (0 of 4).\n- Settings search in a native language can miss existing controls. Category browsing works.\n- This release is not claimed to be bug-free or to work in every language.\n\n## Licence\n\nThe code is GPL-3.0. Some components and data have their own separate terms. Ga Wiemɔ attribution and all data terms are in NOTICE. The personal, noncommercial beta label applies. Read NOTICE before you reuse anything.\n\n## Upstream\n\nDo not report problems with this beta to upstream HeliBoard.\n\nNo pull request or issue was sent to the original HeliBoard project. Its current contribution rules prohibit AI-generated pull requests and issues.",'draft':True,'prerelease':True}
            request=work/'release.json';request.write_text(json.dumps(payload))
            release_absent()
            print(json.dumps({'stage':'create-intent','tag':TAG,'retry':'Do not repeat an uncertain creation'}),flush=True)
            release=gh(['api','--method','POST','repos/'+REPO+'/releases','--input',str(request)])
            release_id=release['id'];assert release['draft'] is True
            print(json.dumps({'stage':'draft-created','releaseId':release_id,'tag':TAG}),flush=True)
            r=subprocess.run(['gh','release','upload',TAG,'--repo',REPO]+paths,capture_output=True,text=True)
            if r.returncode:raise RuntimeError('Upload incomplete; preserve draft '+str(release_id)+' and reconcile: '+r.stderr.strip())
            current=gh(['api','repos/'+REPO+'/releases/'+str(release_id)])
            assert current['draft'] is True and current['tag_name']==TAG
            assets={a['name']:a for a in current['assets']};assert set(assets)=={o['name'] for o in OBJECTS}
            for obj in OBJECTS:
             asset=assets[obj['name']];assert asset['size']==obj['bytes'] and asset['state']=='uploaded'
             digest=asset.get('digest')
             if digest:
              assert digest=='sha256:'+obj['sha256'],'GitHub-computed digest differs'
             else:
              p=subprocess.Popen(['gh','api','repos/'+REPO+'/releases/assets/'+str(asset['id']),'-H','Accept: application/octet-stream'],stdout=subprocess.PIPE,stderr=subprocess.PIPE)
              size,hashed=sha_stream(p.stdout);error=p.stderr.read();assert p.wait()==0 and exact(obj,size,hashed),'Draft asset readback failed'
            print(json.dumps({'stage':'four-draft-assets-verified','releaseId':release_id}),flush=True)
            publish=work/'publish.json';publish.write_text(json.dumps({'draft':False}))
            print(json.dumps({'stage':'publish-intent','releaseId':release_id}),flush=True)
            visible=gh(['api','--method','PATCH','repos/'+REPO+'/releases/'+str(release_id),'--input',str(publish)])
            assert visible['draft'] is False
            proof=[]
            for obj in OBJECTS:
             url='https://github.com/'+REPO+'/releases/download/'+TAG+'/'+obj['name'];item=verify_public(obj,url);proof.append(item)
             print(json.dumps({'stage':'public-full-hash-verified',**item}),flush=True)
            print(json.dumps({'stage':'complete','releaseId':release_id,'url':visible['html_url'],'assets':proof,'rebuilt':False,'resigned':False}),flush=True)
          if __name__=='__main__':main()
          PY
