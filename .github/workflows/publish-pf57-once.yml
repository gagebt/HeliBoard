name: Publish accepted pf57 once
on:
  push:
    branches: [personal/parakeet-futo]
    paths: [.github/workflows/publish-pf57-once.yml]
concurrency:
  group: accepted-pf57-mirror
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify and publish exact accepted files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,tempfile,urllib.request
          REPO='gagebt/HeliBoard'
          TAG='4.1-pf57'
          BASE='https://olegk.ai/dl-zfqlope5olthyny/'
          OBJECTS=[{"kind":"source","name":"heliboard-parakeet-futo-4.1-pf57-source.tar.gz","bytes":620081598,"sha256":"e9f9d89e99f2ef14d874c5d03d36c96562a0a3428d277c34a7d05970311f8c64"},{"kind":"notice","name":"heliboard-parakeet-futo-4.1-pf57-NOTICE.txt","bytes":31100,"sha256":"4c2d70511cbe6b267f449403a41f679a237a36d272aab993ad5f99a11058d432"},{"kind":"full","name":"heliboard-parakeet-futo-4.1-pf57.apk","bytes":560176641,"sha256":"73103703d4a5d26cf13e3b1b64c8825703a42706ca6431d58289aa0938b2e3d6"},{"kind":"lite","name":"heliboard-parakeet-futo-4.1-pf57-lite.apk","bytes":92241137,"sha256":"fcbf226b965d5784520eac9804bac51daf91e33ed602ea2836e281247787ab7f"}]
          def gh(args):
           r=subprocess.run(['gh']+args,capture_output=True,text=True)
           if r.returncode:raise RuntimeError('GitHub command failed: '+r.stderr.strip())
           return json.loads(r.stdout)
          def sha_stream(f):
           h=hashlib.sha256();size=0
           while b:=f.read(4*1024*1024):h.update(b);size+=len(b)
           return size,h.hexdigest()
          def exact(obj,size,digest):return size==obj['bytes'] and digest==obj['sha256']
          def check_controls():
           obj=OBJECTS[0]
           assert exact(obj,obj['bytes'],obj['sha256'])
           assert not exact(obj,obj['bytes']-1,obj['sha256'])
           assert not exact(obj,obj['bytes'],'0'*64)
          def absent(endpoint):
           r=subprocess.run(['gh','api',endpoint],capture_output=True,text=True)
           if r.returncode==0:raise RuntimeError('Existing GitHub object: reconcile before another publication')
           if 'HTTP 404' not in r.stderr:raise RuntimeError('Cannot establish pre-egress absence')
          def no_release(pages):
           if not isinstance(pages,list):raise RuntimeError('Cannot establish release absence')
           for page in pages:
            if not isinstance(page,list):raise RuntimeError('Cannot establish release absence')
            for release in page:
             if not isinstance(release,dict) or not isinstance(release.get('tag_name'),str):raise RuntimeError('Unreadable release identity')
             if release['tag_name']==TAG:raise RuntimeError('Existing release or draft: reconcile before another publication')
          def release_absent():
           no_release(gh(['api','--paginate','--slurp','repos/'+REPO+'/releases?per_page=100']))
          def verify_public(obj,url):
           req=urllib.request.Request(url,headers={'User-Agent':'HeliBoard57-release-proof','Accept-Encoding':'identity'})
           with urllib.request.urlopen(req,timeout=120) as f:
            assert f.status==200
            size,digest=sha_stream(f)
           assert exact(obj,size,digest),'Public download differs'
           return {'name':obj['name'],'url':url,'bytes':size,'sha256':digest,'status':200}
          def main():
           check_controls()
           assert os.environ.get('GITHUB_REPOSITORY')==REPO
           assert os.environ.get('GITHUB_REF')=='refs/heads/personal/parakeet-futo'
           repo=gh(['api','repos/'+REPO]);assert repo['private'] is False and repo['archived'] is False
           release_absent();absent('repos/'+REPO+'/git/ref/tags/'+TAG)
           with tempfile.TemporaryDirectory(prefix='heliboard57-') as tmp:
            work=pathlib.Path(tmp)
            free=os.statvfs(work).f_bavail*os.statvfs(work).f_frsize
            assert free>sum(o['bytes'] for o in OBJECTS)*2+1_000_000_000
            paths=[]
            for obj in OBJECTS:
             p=work/obj['name'];h=hashlib.sha256();size=0
             req=urllib.request.Request(BASE+obj['name'],headers={'Accept-Encoding':'identity','User-Agent':'HeliBoard57-copy'})
             with urllib.request.urlopen(req,timeout=120) as source,p.open('xb') as target:
              assert source.status==200
              while b:=source.read(4*1024*1024):target.write(b);h.update(b);size+=len(b)
              target.flush();os.fsync(target.fileno())
             assert exact(obj,size,h.hexdigest()),'Website input differs; no release egress'
             paths.append(str(p));print(json.dumps({'stage':'input-verified','name':obj['name'],'bytes':size,'sha256':h.hexdigest()}),flush=True)
            payload={'tag_name':TAG,'target_commitish':os.environ['GITHUB_SHA'],'name':'HeliBoard Full/Lite 4.1-pf57 — personal noncommercial beta','body':"# HeliBoard 4.1-pf57 (versionCode 4166) — Full and Lite\n\nIncremental personal noncommercial beta on top of 4.1-pf56. The175 main typing and emoji dictionary assets and retained shared models are byte-equal to pf56. This is a fork, not an official HeliBoard release.\n\n## Changes\n\n- **Swipe vocabulary is no longer bundled.** The 94 prepared swipe-asset files and their build scripts are removed. The swipe vocabulary is now created on the device, only for enabled languages (including configured secondary languages), and reused from a validated cache. Disabling a language stops new work for it. Existing derived files for a language you disabled are not purged.\n- **Cursor and composition fix.** Suggestion lookup no longer arms editor composition. The input path reconciles editor changes and live selection before a replacement. Controlled tests that failed on pf56 now preserve the intended text and deliberate selections. This repairs the demonstrated stale-span mechanism; it does not establish that every browser or voice case is fixed. Reported symptom: after a caret move, typing erased text elsewhere and appeared in an unexpected place.\n\n## Assets\n\n| File | Package | Bytes | SHA-256 |\n|---|---|---|---|\n| heliboard-parakeet-futo-4.1-pf57.apk | helium314.keyboard.parakeetfuto | 560176641 | 73103703d4a5d26cf13e3b1b64c8825703a42706ca6431d58289aa0938b2e3d6 |\n| heliboard-parakeet-futo-4.1-pf57-lite.apk | helium314.keyboard.parakeetfuto.lite | 92241137 | fcbf226b965d5784520eac9804bac51daf91e33ed602ea2836e281247787ab7f |\n| heliboard-parakeet-futo-4.1-pf57-source.tar.gz | — | 620081598 | e9f9d89e99f2ef14d874c5d03d36c96562a0a3428d277c34a7d05970311f8c64 |\n| heliboard-parakeet-futo-4.1-pf57-NOTICE.txt | — | 31100 | 4c2d70511cbe6b267f449403a41f679a237a36d272aab993ad5f99a11058d432 |\n\nBoth APKs are signed with the same certificate as pf56 (SHA-256 `51ca207212fc200ea8e9f004a441ca3b9a27e519a53526dc51a3edf369166d3b`), so they update an installed pf56 in place. Full includes the voice model; Lite has no voice model. Native libraries: arm64-v8a and x86_64.\n\n## Testing and limits\n\n- Host unit tests: the InputLogic suite, 196 scenarios per flavor, passes with zero failures. The older full project suite is **not** clean: five retained link, emoji and search failure executions per flavor remain in an earlier whole-project run and are not addressed in this release.\n- Current signed Full passed an isolated controlled delayed-caret check and ordinary Android browser textarea/contenteditable insertion and deliberate-selection checks. Current Full and Lite also completed two fresh independent focused user goals. The Russian/English run passed. The German/English run keeps FAIL for an unexplained transient hidden keyboard; a field tap restored it. This is not a whole usability audit or a proved new regression.\n- Broader controlled refusal/composition cases and actual Russian vocabulary creation were checked on the preceding preparatory57 build. Those results are reused with their dated source boundary; they are not described as fresh checks on the final APK pair.\n- **Not verified:** a physical phone, ARM64 hardware, voice input in this release, other languages' vocabulary creation time or memory, cold-start latency, and the reporter's exact browser episode. The cursor fix addresses a mechanism found by controlled tests and is not a confirmed fix for every browser or voice case.\n- Other open items carry over from earlier releases: native-search quality, universal punctuation, voice-to-swipe, long-idle Copy and saved-word choice.\n\n## Source\n\nThe attached `heliboard-parakeet-futo-4.1-pf57-source.tar.gz` is the only source that corresponds to these APKs. **The branch tree and tag in this repository are an older September snapshot and do not match these builds.** The raw dictionary corpus and model are not in Git; the model is taken from the Full APK as described in the source package notes. Accepted pf56 remains available and unchanged.\n\n\nRead `heliboard-parakeet-futo-4.1-pf57-NOTICE.txt` for component licences, creator credits and data terms. The personal noncommercial beta label does not relicense the GPL app code or component data. Keep another keyboard enabled during first use.\n",'draft':True,'prerelease':True}
            request=work/'release.json';request.write_text(json.dumps(payload))
            release_absent()
            print(json.dumps({'stage':'create-intent','tag':TAG,'retry':'Do not repeat an uncertain creation'}),flush=True)
            release=gh(['api','--method','POST','repos/'+REPO+'/releases','--input',str(request)])
            release_id=release['id'];assert release['draft'] is True
            print(json.dumps({'stage':'draft-created','releaseId':release_id,'tag':TAG}),flush=True)
            r=subprocess.run(['gh','release','upload',TAG,'--repo',REPO]+paths,capture_output=True,text=True)
            if r.returncode:raise RuntimeError('Upload incomplete; preserve draft '+str(release_id)+' and reconcile: '+r.stderr.strip())
            current=gh(['api','repos/'+REPO+'/releases/'+str(release_id)])
            assert current['draft'] is True and current['tag_name']==TAG
            assets={a['name']:a for a in current['assets']};assert set(assets)=={o['name'] for o in OBJECTS}
            for obj in OBJECTS:
             asset=assets[obj['name']];assert asset['size']==obj['bytes'] and asset['state']=='uploaded'
             digest=asset.get('digest')
             if digest:
              assert digest=='sha256:'+obj['sha256'],'GitHub-computed digest differs'
             else:
              p=subprocess.Popen(['gh','api','repos/'+REPO+'/releases/assets/'+str(asset['id']),'-H','Accept: application/octet-stream'],stdout=subprocess.PIPE,stderr=subprocess.PIPE)
              size,hashed=sha_stream(p.stdout);error=p.stderr.read();assert p.wait()==0 and exact(obj,size,hashed),'Draft asset readback failed'
            print(json.dumps({'stage':'four-draft-assets-verified','releaseId':release_id}),flush=True)
            publish=work/'publish.json';publish.write_text(json.dumps({'draft':False}))
            print(json.dumps({'stage':'publish-intent','releaseId':release_id}),flush=True)
            visible=gh(['api','--method','PATCH','repos/'+REPO+'/releases/'+str(release_id),'--input',str(publish)])
            assert visible['draft'] is False
            proof=[]
            for obj in OBJECTS:
             url='https://github.com/'+REPO+'/releases/download/'+TAG+'/'+obj['name'];item=verify_public(obj,url);proof.append(item)
             print(json.dumps({'stage':'public-full-hash-verified',**item}),flush=True)
            print(json.dumps({'stage':'complete','releaseId':release_id,'url':visible['html_url'],'assets':proof,'rebuilt':False,'resigned':False}),flush=True)
          if __name__=='__main__':main()
          PY
